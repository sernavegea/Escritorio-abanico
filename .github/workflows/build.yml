name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la parte de Android que falta
        run: flutter create --platforms=android --org com.sergio --project-name escritorio_abanico .

      - name: Usar siempre la misma firma (para actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Preparar archivo
        run: cp build/app/outputs/flutter-apk/app-release.apk Abanico-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Abanico-apk
          path: Abanico-*.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Abanico 0.1.${{ github.run_number }}
          body: APK compilado automáticamente. Descárgalo desde el móvil e instálalo.
          files: Abanico-*.apk

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la parte de Windows
        run: flutter create --platforms=windows --org com.sergio --project-name escritorio_abanico .

      - name: Nombre, icono y ventana maximizada
        shell: pwsh
        run: |
          $m = 'windows\runner\main.cpp'
          (Get-Content $m -Raw) -replace 'L"escritorio_abanico"', 'L"Abanico"' | Set-Content $m -Encoding utf8
          $w = 'windows\runner\win32_window.cpp'
          (Get-Content $w -Raw) -replace 'SW_SHOWNORMAL', 'SW_SHOWMAXIMIZED' | Set-Content $w -Encoding utf8
          Copy-Item ci\app_icon.ico windows\runner\resources\app_icon.ico -Force

      - run: flutter pub get

      - name: Compilar para Windows
        run: flutter build windows --release

      - name: Empaquetar
        shell: pwsh
        run: |
          $out = "Abanico-Windows-0.1.${{ github.run_number }}"
          Copy-Item build\windows\x64\runner\Release $out -Recurse
          Rename-Item "$out\escritorio_abanico.exe" "Abanico.exe"
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - name: Añadir a la versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          files: Abanico-Windows-*.zip
