name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la parte de Android que falta
        run: flutter create --platforms=android --org com.sergio --project-name escritorio_abanico .

      - name: Usar siempre la misma firma (para actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Preparar archivo
        run: cp build/app/outputs/flutter-apk/app-release.apk Abanico-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Abanico-apk
          path: Abanico-*.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Abanico 0.1.${{ github.run_number }}
          body: APK compilado automáticamente. Descárgalo desde el móvil e instálalo.
          files: Abanico-*.apk
