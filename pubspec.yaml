name: escritorio_abanico
description: Escritorio en abanico para Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  photo_manager: ^3.6.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  camera: '>=0.11.0 <1.0.0'
  google_mlkit_face_detection: '>=0.13.1 <1.0.0'

flutter:
  uses-material-design: true

# La versión 2.5.0 de shared_preferences_android (nueva implementación JNI) deja la app en negro
# al arrancar en la versión de publicación. Se fija la última 2.4.x, que funcionaba.
dependency_overrides:
  shared_preferences_android: '>=2.4.20 <2.5.0'
